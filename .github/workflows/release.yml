name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  GHCR_IMAGE: ghcr.io/andrewtheguy/audio_pattern_detector

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine and validate version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "audio-pattern-detector") | .version')
          if [ -z "$version" ]; then
            echo "Could not determine version from Cargo.toml" >&2
            exit 1
          fi
          release_tag="v${version}"

          if gh api "repos/${GH_REPO}/git/ref/tags/${release_tag}" >/dev/null 2>&1; then
            echo "Tag ${release_tag} already exists. Bump the version before releasing." >&2
            exit 1
          fi

          echo "Release tag: ${release_tag}"
          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
            docker_arch: x86_64
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-24.04-arm
            docker_arch: arm64
          - target: aarch64-apple-darwin
            runs-on: macos-latest
          - target: x86_64-pc-windows-msvc
            runs-on: windows-latest

    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          name="audio-pattern-detector-${RELEASE_TAG}-${TARGET}"
          mkdir -p "dist/${name}"
          cp README.md "dist/${name}/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${TARGET}/release/audio-pattern-detector.exe" "dist/${name}/"
            (cd dist && 7z a "${name}.zip" "${name}")
          else
            cp "target/${TARGET}/release/audio-pattern-detector" "dist/${name}/"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

      - name: Log in to GHCR
        if: matrix.docker_arch
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (using pre-built binary)
        if: matrix.docker_arch
        run: |
          TAG=${{ needs.prepare.outputs.tag }}
          # Copy binary to build context root for Dockerfile
          cp target/${{ matrix.target }}/release/audio-pattern-detector audio-pattern-detector
          docker build --target runtime-prebuilt -t ${{ env.GHCR_IMAGE }}:${TAG}-${{ matrix.docker_arch }} .
          docker push ${{ env.GHCR_IMAGE }}:${TAG}-${{ matrix.docker_arch }}

  build-wheel:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
          - arch: arm64
            runs-on: macos-latest
          - arch: amd64
            runs-on: windows-latest

    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install release build dependencies
        run: python -m pip install --upgrade pip maturin

      # abi3 wheel: one build per platform works on every Python >= 3.9.
      - name: Build wheel
        env:
          PYO3_PYTHON: python
        run: maturin build --release --locked -o dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ runner.os }}-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  create-release:
    needs: [prepare, build, build-wheel]
    runs-on: ubuntu-latest

    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: release-assets

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: python-wheel-*
          path: release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.whl' \) -print0 | sort -z)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found under release-assets" >&2
            exit 1
          fi

          prerelease_flag=""
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            prerelease_flag="--prerelease"
          fi

          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --target "${GITHUB_SHA}" \
            $prerelease_flag \
            "${assets[@]}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          TAG=${{ needs.prepare.outputs.tag }}
          # Create manifest combining both architectures
          docker manifest create ${{ env.GHCR_IMAGE }}:${TAG} \
            ${{ env.GHCR_IMAGE }}:${TAG}-x86_64 \
            ${{ env.GHCR_IMAGE }}:${TAG}-arm64
          docker manifest push ${{ env.GHCR_IMAGE }}:${TAG}

          # Only tag as latest on non-prerelease (main branch) builds
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            docker manifest create ${{ env.GHCR_IMAGE }}:latest \
              ${{ env.GHCR_IMAGE }}:${TAG}-x86_64 \
              ${{ env.GHCR_IMAGE }}:${TAG}-arm64
            docker manifest push ${{ env.GHCR_IMAGE }}:latest
          fi

  # Refresh the PEP 503 index that lists the wheels of every release.
  deploy-pages:
    if: github.ref_name == 'main'
    needs: create-release
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
